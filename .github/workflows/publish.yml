name: Publish

# Publishing happens HERE and not from a laptop, and that is not a preference.
#
# There is no npm token. The registry is configured to trust THIS repository and THIS workflow
# file, and GitHub hands the job a short-lived OIDC token that proves both, the same handshake
# that signs the provenance attestation. Nothing long-lived exists to leak, rotate, or be blocked
# by an account's two-factor policy.
#
# Changing the filename of this workflow breaks publishing until the trusted publisher on
# npmjs.com is updated to match, because the name is half of what npm is trusting.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (a prerelease version must not go to latest)'
        required: false
        default: latest

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights; without it there is no auth at all

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer. Pinning an exact version rather than inheriting
      # whatever the runner image bundles, or whatever "latest" means today, keeps a runner or
      # registry update from quietly turning this back into "no token, no auth, no publish".
      - run: npm install -g npm@12.0.2

      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody asked for, under a name
      # nobody will look for. npm would accept it happily, and the version can never be replaced.
      # A GitHub prerelease, or any version with a prerelease suffix, goes to `next`: nobody
      # installing `latest` should get a build that was published as a trial.
      - name: choose the dist-tag
        id: dist
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          manifest=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$manifest" != "$tag" ]; then
              echo "release tag v$tag does not match package.json $manifest" >&2
              exit 1
            fi
            if [ "$RELEASE_PRERELEASE" = "true" ]; then dist=next; else dist=latest; fi
          else
            if [ "$(git describe --tags --exact-match 2>/dev/null)" != "v$manifest" ]; then
              echo "the checked-out commit is not tagged v$manifest; dispatch the workflow from the release tag" >&2
              exit 1
            fi
            dist="${INPUT_TAG:-latest}"
          fi
          case "$manifest" in
            *-*) if [ "$dist" = "latest" ]; then echo "$manifest is a prerelease and cannot be published as latest" >&2; exit 1; fi ;;
          esac
          echo "tag=$dist" >> "$GITHUB_OUTPUT"
          echo "publishing $manifest as $dist"

      # `prepack` builds, `prepublishOnly` tests. Nothing is uploaded
      # until they pass. No `env:` block: the OIDC token is exchanged by npm itself.
      - run: npm publish --tag "${{ steps.dist.outputs.tag }}"

      - name: prove it is installable
        run: |
          set -e
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          version=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          # A new version takes a minute or two to reach the registry's read side after publishing,
          # so a first "no matching version" is not a failed release. Give it fifteen minutes.
          for attempt in $(seq 1 60); do
            if npm install --prefer-online "@vinktarhq/node@$version" > /dev/null 2>&1; then break; fi
            [ "$attempt" = 60 ] && { echo "@vinktarhq/node@$version was not installable after fifteen minutes" >&2; exit 1; }
            sleep 15
          done
          node -e "const m=require('@vinktarhq/node'); if(typeof m.init!=='function') process.exit(1)"
